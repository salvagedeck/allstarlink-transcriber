name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: allstarlink-transcriber:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run linting
      run: |
        docker run --rm \
          -v $(pwd)/backend:/app/backend \
          -v $(pwd)/frontend:/app/frontend \
          python:3.11-alpine \
          sh -c "pip install pylint && pylint backend/main.py || true"
    
    - name: Check code format
      run: |
        docker run --rm \
          -v $(pwd):/app \
          node:20-alpine \
          sh -c "cd /app/frontend && npm install && npm run build"

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run backend tests
      run: |
        docker run --rm \
          -v $(pwd)/backend:/app \
          python:3.11 \
          sh -c "cd /app && pip install -r requirements.txt && python -m pytest"
    
    - name: Test Docker build
      run: docker-compose build

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload security results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/allstarlink-transcriber:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/allstarlink-transcriber:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
